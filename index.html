<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অনলাইন শপ</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff4757;
        }
        .products-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 200px;
            text-align: center;
        }
        .product-card h3 {
            font-size: 16px;
            color: #333;
        }
        .price {
            color: #ff4757;
            font-weight: bold;
            margin: 10px 0;
        }
        .buy-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .buy-btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <h1>আমার অনলাইন শপে স্বাগতম!</h1>
    <p>এটি দারাজের মতো একটি ই-কমার্স সাইটের প্রাথমিক রূপ।</p>

    <div class="products-container">
        <!-- প্রোডাক্ট ১ -->
        <div class="product-card">
            <h3>স্মার্ট ওয়াচ</h3>
            <div class="price">১,৫০০ টাকা</div>
            <button class="buy-btn">কিনুন</button>
        </div>

        <!-- প্রোডাক্ট ২ -->
        <div class="product-card">
            <h3>ওয়্যারলেস হেডফোন</h3>
            <div class="price">২,২০০ টাকা</div>
            <button class="buy-btn">কিনুন</button>
        </div>
    </div>

</body>
</html>
