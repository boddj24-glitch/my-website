<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV Web Player</title>
    <!-- HLS.js লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: auto; }
        .channel-list { flex: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; max-height: 500px; overflow-y: auto; }
        .channel-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; }
        .channel-item:hover { background: #333; }
        .player-container { flex: 2; background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; }
    </style>
</head>
<body>

    <h1>Smart TV Web Player</h1>
    <div class="container">
        <div class="channel-list" id="channelList">
            <h3>Channels</h3>
            <p>Loading channels...</p>
        </div>
        <div class="player-container">
            <h3>Player</h3>
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        let hls = null; // গ্লোবাল hls ভেরিয়েবল

        fetch('http://127.0.0.1:5000/api/channels')
            .then(response => response.text())
            .then(data => {
                const listDiv = document.getElementById('channelList');
                listDiv.innerHTML = '<h3>Channels</h3>';
                
                const lines = data.split('\n');
                let currentTitle = '';

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        let parts = line.split(',');
                        currentTitle = parts[1] ? parts[1].trim() : 'Unknown Channel';
                    } else if (line.startsWith('http')) {
                        let streamUrl = line; // প্রতিটি লাইনের নিজস্ব ইউনিক লিংক
                        let item = document.createElement('div');
                        item.className = 'channel-item';
                        item.innerText = currentTitle;
                        
                        // নির্দিষ্ট চ্যানেলে ক্লিক করার ফাংশন
                        item.onclick = function() {
                            const video = document.getElementById('videoPlayer');
                            console.log("Playing URL:", streamUrl); // কনসোলে চেক করার জন্য
                            
                            // আগের hls ইনস্ট্যান্স থাকলে তা ধ্বংস করা
                            if (hls) {
                                hls.destroy();
                            }

                            if (Hls.isSupported()) {
                                hls = new Hls();
                                hls.loadSource(streamUrl);
                                hls.attachMedia(video);
                                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                    video.play().catch(e => console.log("Play error:", e));
                                });
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = streamUrl;
                                video.addEventListener('loadedmetadata', function() {
                                    video.play();
                                });
                            }
                        };
                        
                        listDiv.appendChild(item);
                    }
                });
            })
            .catch(err => {
                console.error('Error loading channels:', err);
                document.getElementById('channelList').innerHTML = '<p>Error loading channels.</p>';
            });
    </script>

</body>
</html>
