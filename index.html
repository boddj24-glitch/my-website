    <style>

        body {

        .main-container {

        .player-section {

        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .logo-header { 
            font-size: 26px;

            color: var(--accent-color); 
            letter-spacing: 2px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(229, 184, 96, 0.3);
            margin: 0;
            white-space: nowrap;
        }

        .header-server-switcher {
            flex-grow: 1;
            min-width: 250px;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 8px;

        .server-title {
            font-size: 12px;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .server-buttons-wrap {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .server-btn {
            background: #21262d;
            color: #fff;
            border: 1px solid #30363d;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;

        }

        .server-btn:hover {
            border-color: var(--accent-color);
        }

        .server-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .channel-list-container {
            flex: 2.1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        .category-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
            justify-content: flex-start;
            flex-wrap: nowrap;

        .cat-btn {
            background: #21262d;

            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;

            transition: 0.2s;
            white-space: nowrap;

            border-color: var(--accent-color);
        }

        .cat-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .channel-list { 
            display: grid; 
            grid-template-columns: repeat(4, minmax(0, 1fr)); 
            gap: 10px; 
            height: 73vh; 
            overflow-y: auto;
            background: var(--bg-color); 
            padding: 15px; 
            padding-right: 10px;
            border-radius: 12px;

        .video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px;

            margin-top: 15px;

        #my-video, #clappr-container, #html5-video, #custom-iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none; 
            position: absolute;

        .modes { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            justify-content: center; 
            flex-wrap: wrap;

        .btn {

            color: #fff; 
            border: none;

            border-radius: 6px;

            background: var(--accent-color);

        .pip-btn { 
            background: #ff4757 !important;

        .ch-btn { 
            background: #21262d; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: center; 
            border: 1px solid #30363d; 
            transition: 0.3s; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 95px;
            box-sizing: border-box;
        }
        
        .ch-btn:hover {

            border-color: var(--accent-color);

        .ch-btn img {

        .ch-btn strong { 
            font-size: 13.2px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        
        .input-box { 
            display: flex; 
            gap: 10px; 
            max-width: 1800px; 
            margin: 20px auto 10px auto;

        #customUrlInput { 
            flex: 1;

        .play-btn { 
            background: var(--accent-color);

        .social-footer {

        .social-btn {

            transition: 0.3s;

        .telegram-btn { background: #0088cc; }
        .telegram-btn:hover { background: #0077b5; border-color: #fff; }

        .facebook-btn { background: #1877f2; }
        .facebook-btn:hover { background: #145dbf; border-color: #fff; }

        .whatsapp-btn { background: #25d366; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>

<body>

    <div class="main-container">
        <div class="player-section">
            
            <div class="header-wrapper">
                <div class="logo-header">SHAWON TV</div>
                
                <div id="serverSwitcherBox" class="header-server-switcher">
                    <div class="server-title" id="activeChannelName">চ্যানেল সিলেক্ট করুন</div>
                    <div class="server-buttons-wrap" id="serverButtonsContainer"></div>
                </div>
            </div>

            <div class="video-box">
                <video id="my-video" class="video-js vjs-big-play-centered" controls></video>
                <div id="clappr-container" style="display:none;"></div>
                <video id="html5-video" controls style="display:none;"></video>
                <iframe id="custom-iframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen="true" style="display:none;"></iframe>
            </div>
            
            <div class="modes">
                <button class="btn" onclick="switchMode('videojs')">Main (Video.js)</button>
                <button class="btn" onclick="switchMode('clappr')">Clappr</button>
                <button class="btn" onclick="switchMode('html5')">HTML5</button>
                <button class="btn" onclick="switchMode('iframe')">Iframe</button>
                <button class="btn pip-btn" onclick="togglePIP()">PIP Mode</button>
            </div>
        </div>

        <div class="channel-list-container">
            <!-- Category Filter Bar -->
            <div class="category-bar">
                <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
                <button class="cat-btn" onclick="filterCategory('sports', this)">Sports</button>
                <button class="cat-btn" onclick="filterCategory('bangla', this)">Bangla</button>
                <button class="cat-btn" onclick="filterCategory('indian_bangla', this)">Indian Bangla</button>
                <button class="cat-btn" onclick="filterCategory('hindi', this)">Hindi</button>
                <button class="cat-btn" onclick="filterCategory('music', this)">Music</button>
                <button class="cat-btn" onclick="filterCategory('documentary', this)">Documentary</button>
                <button class="cat-btn" onclick="filterCategory('cartoon', this)">Cartoon</button>
            </div>

            <div class="channel-list" id="channelContainer">
                <p style="text-align: center; color: #888; grid-column: span 4;">চ্যানেল লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <div class="input-box">
        <input type="text" id="customUrlInput" placeholder="লিঙ্ক এখানে দিন (M3U8, MPD বা URL)...">
        <button class="play-btn" onclick="playCustom()">প্লে করুন</button>
    </div>

    <div class="social-footer">
        <a href="https://t.me/shawonpb" target="_blank" class="social-btn telegram-btn">📱 Join Telegram</a>
        <a href="https://www.facebook.com/aribashawon6672" target="_blank" class="social-btn facebook-btn">🌐 Follow Facebook</a>
        <a href="https://wa.me/8801812895985" target="_blank" class="social-btn whatsapp-btn">💬 Join WhatsApp</a>
    </div>

    <script>
        // Security Controls
        ['contextmenu', 'selectstart', 'copy', 'cut', 'dragstart'].forEach(eventType => {
            document.addEventListener(eventType, e => e.preventDefault());
        });

        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'u', 'S', 's', 'C', 'c', 'P', 'p'].includes(e.key))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        function checkDevTools() {
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            
            if (widthThreshold || heightThreshold) {
                document.body.innerHTML = "<div style='background:black;height:100vh;display:flex;justify-content:center;align-items:center;'><h1 style='color:red;font-family:sans-serif;text-align:center;'>⛔ Security Alert: Developer Tools are blocked on this site!</h1></div>";
                window.location.href = "about:blank";
            }
        }
        setInterval(checkDevTools, 300);

        // Player & Category Filter Logic
        const videoEl = document.getElementById('my-video');
        const iframe = document.getElementById('custom-iframe');
        const clapprEl = document.getElementById('clappr-container');
        const html5El = document.getElementById('html5-video');
        let clapprInstance;
        let hls; 
        let dashPlayer;
        let currentMode = 'videojs';
        let currentUrl = '';
        let allChannels = [];
        let currentFilter = 'all';

        function togglePIP() {
            if (videoEl.style.display !== 'none' && document.pictureInPictureEnabled) {
                videoEl.requestPictureInPicture();
            }
        }

        function switchMode(mode) {
            if (currentUrl) loadChannelUrl(currentUrl, mode);
        }

        function loadChannel(ch) {
            const buttonsContainer = document.getElementById('serverButtonsContainer');
            const channelNameEl = document.getElementById('activeChannelName');

            buttonsContainer.innerHTML = '';

            let urls = Array.isArray(ch.url) ? ch.url : [ch.url];
            channelNameEl.innerText = ch.name + " - সার্ভার পরিবর্তন করুন";

            urls.forEach((link, index) => {
                const sBtn = document.createElement('button');
                sBtn.className = 'server-btn';
                sBtn.innerText = `Server ${index + 1}`;
                if (index === 0) sBtn.classList.add('active');

                sBtn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    sBtn.classList.add('active');
                    loadChannelUrl(link, currentMode);
                };
                buttonsContainer.appendChild(sBtn);
            });

            loadChannelUrl(urls[0], currentMode);
        }

        function loadChannelUrl(url, mode) {
            let finalUrl = url;

            currentUrl = url; 
            currentMode = mode;

            videoEl.style.display = 'none';
            iframe.style.display = 'none';
            clapprEl.style.display = 'none';
            html5El.style.display = 'none';
            
            if (hls) { hls.destroy(); hls = null; }
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
            if (clapprInstance) { clapprInstance.destroy(); clapprInstance = null; }
            
            videoEl.pause();
            videoEl.src = "";
            videoEl.load();
            html5El.pause();
            html5El.src = "";
            iframe.src = "about:blank";

            if (mode === 'iframe') {
                iframe.src = finalUrl;
                iframe.style.display = 'block';
            } else if (mode === 'clappr') {
                clapprEl.style.display = 'block';
                clapprInstance = new Clappr.Player({source: finalUrl, parentId: "#clappr-container", width: '100%', height: '100%', autoPlay: true});
            } else if (mode === 'html5') {
                html5El.style.display = 'block';
                html5El.src = finalUrl;
                html5El.play();
            } else {
                videoEl.style.display = 'block';
                
                if (finalUrl.includes('.mpd') || finalUrl.includes('dash')) {
                    if (typeof dashjs !== 'undefined') {
                        dashPlayer = dashjs.MediaPlayer().create();
                        dashPlayer.initialize(videoEl, finalUrl, true);
                    } else {
                        videoEl.src = finalUrl;
                        videoEl.play();
                    }
                } else if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(finalUrl);
                    hls.attachMedia(videoEl);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play());
                } else {
                    videoEl.src = finalUrl;
                    videoEl.play();
                }
            }
        }

        function playCustom() {
            const url = document.getElementById('customUrlInput').value;
            if(url) {
                document.getElementById('serverButtonsContainer').innerHTML = "";
                document.getElementById('activeChannelName').innerText = "Custom URL - সার্ভার পরিবর্তন করুন";
                loadChannelUrl(url, currentMode);
            }
        }

        function renderChannels() {
            const container = document.getElementById('channelContainer');
            container.innerHTML = '';

            let filteredChannels = allChannels.filter(ch => {
                if (currentFilter === 'all') return true;
                return ch.group && ch.group.toLowerCase() === currentFilter.toLowerCase();
            });

            if (filteredChannels.length > 0) {
                filteredChannels.forEach(ch => {
                    const btn = document.createElement('div');
                    btn.className = 'ch-btn';
                    
                    let img = document.createElement('img');
                    img.src = ch.logo;
                    img.onerror = () => { img.src = "https://i.postimg.cc/W1z5BGPZ/20240823_024712.png"; };
                    
                    let strong = document.createElement('strong');
                    strong.innerText = ch.name;
                    
                    btn.appendChild(img);
                    btn.appendChild(strong);
                    
                    btn.onclick = () => loadChannel(ch);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = '<p style="text-align: center; color: #888; grid-column: span 4; padding: 20px;">এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।</p>';
            }
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentFilter = category;
            renderChannels();
        }

        // Accurate Categorization Engine
        fetch('https://raw.githubusercontent.com/boddj24-glitch/my-website/refs/heads/main/playlist.m3u')
            .then(response => response.text())
            .then(data => {
                const lines = data.split(/\r?\n/);
                allChannels = [];
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        let logo = logoMatch ? logoMatch[1] : 'https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';
                        
                        let groupMatch = line.match(/group-title="([^"]+)"/);
                        let rawGroup = groupMatch ? groupMatch[1].trim().toLowerCase() : '';
                        
                        let nameParts = line.split(',');
                        let title = nameParts[nameParts.length - 1].trim();
                        
                        let streamUrl = '#';
                        for (let j = i + 1; j < lines.length; j++) {
                            let nextLine = lines[j].trim();
                            if (nextLine && !nextLine.startsWith('#')) {
                                streamUrl = nextLine;
                                break;
                            }
                        }
                        
                        if (title) {
                            let lowerTitle = title.toLowerCase();
                            let detectedGroup = 'other';

                            // 1. SPORTS
                            if (rawGroup === 'sports' || rawGroup.includes('sport') || lowerTitle.includes('sports') || lowerTitle.includes('cricket') || lowerTitle.includes('football') || lowerTitle.includes('willow') || lowerTitle.includes('ten sports') || lowerTitle.includes('bein') || lowerTitle.includes('ptv sports') || lowerTitle.includes('sky sports')) {
                                detectedGroup = 'sports';
                            } 
                            // 2. INDIAN BANGLA
                            else if (rawGroup === 'indian_bangla' || rawGroup.includes('indian') || lowerTitle.includes('jalsha') || lowerTitle.includes('zee bangla') || lowerTitle.includes('colors bangla') || lowerTitle.includes('sun bangla') || lowerTitle.includes('sananda')) {
                                detectedGroup = 'indian_bangla';
                            } 
                            // 3. HINDI
                            else if (rawGroup === 'hindi' || lowerTitle.includes('star gold') || lowerTitle.includes('sony max') || lowerTitle.includes('zee tv') || lowerTitle.includes('zee cinema') || lowerTitle.includes('bollywood') || lowerTitle.includes('goldmines') || lowerTitle.includes('pictures') || lowerTitle.includes('&pictures') || lowerTitle.includes('shemaroo')) {
                                detectedGroup = 'hindi';
                            }
                            // 4. MUSIC
                            else if (rawGroup === 'music' || lowerTitle.includes('music') || lowerTitle.includes('b4u music')) {
                                detectedGroup = 'music';
                            }
                            // 5. CARTOON
                            else if (rawGroup === 'cartoon' || lowerTitle.includes('cartoon') || lowerTitle.includes('duronto') || lowerTitle.includes('nick')) {
                                detectedGroup = 'cartoon';
                            }
                            // 6. DOCUMENTARY
                            else if (rawGroup === 'documentary' || rawGroup.includes('docu') || lowerTitle.includes('discovery') || lowerTitle.includes('nat geo') || lowerTitle.includes('animal planet')) {
                                detectedGroup = 'documentary';
                            }
                            // 7. BANGLADESHI CHANNELS ONLY
                            else if (rawGroup === 'bangla' || lowerTitle.includes('btv') || lowerTitle.includes('somoy') || lowerTitle.includes('jamuna') || lowerTitle.includes('ekattor') || lowerTitle.includes('channel 24') || lowerTitle.includes('independent') || lowerTitle.includes('dbc') || lowerTitle.includes('atn') || lowerTitle.includes('rtv') || lowerTitle.includes('ntv') || lowerTitle.includes('banglavision') || lowerTitle.includes('maasranga') || lowerTitle.includes('nagorik') || lowerTitle.includes('gazi') || lowerTitle.includes('deepto') || lowerTitle.includes('ekhon') || lowerTitle.includes('bijoy') || lowerTitle.includes('channel i') || lowerTitle.includes('desh tv') || lowerTitle.includes('asian tv') || lowerTitle.includes('my tv') || lowerTitle.includes('global tv')) {
                                detectedGroup = 'bangla';
                            }
                            // If completely unmatched, assign according to playlist group or default
                            else {
                                detectedGroup = rawGroup || 'bangla';
                            }

                            allChannels.push({ name: title, logo: logo, url: streamUrl, group: detectedGroup });
                        }
                    }
                }

                if (allChannels.length > 0) {
                    renderChannels();
                    loadChannel(allChannels[0]);
                } else {
                    document.getElementById('channelContainer').innerHTML = '<p style="text-align: center; color: red; grid-column: span 4;">কোনো চ্যানেল পাওয়া যায়নি।</p>';
                }
            })
            .catch(error => {
                document.getElementById('channelContainer').innerHTML = '<p style="text-align: center; color: red; grid-column: span 4;">চ্যানেল লিস্ট লোড করতে সমস্যা হয়েছে।</p>';
            });
    </script>
</body>
