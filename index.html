<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV - Live Streaming</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #f39c12; margin-bottom: 20px; }
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .channel-card { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; transition: 0.3s; }
        .channel-card:hover { border-color: #f39c12; transform: translateY(-3px); }
        .channel-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; background: #252525; border-radius: 50%; padding: 5px; }
        .channel-card h3 { font-size: 16px; margin: 10px 0 5px; color: #fff; }
        .channel-card a { display: inline-block; margin-top: 10px; padding: 5px 10px; background: #f39c12; color: #000; text-decoration: none; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .channel-card a:hover { background: #e67e22; }
    </style>
</head>
<body>
    <h1>SHAWON TV - Live Channels</h1>
    <div class="channel-grid" id="channels">
        <p>চ্যানেল লোড হচ্ছে...</p>
    </div>

    <script>
        // এখানে পূর্ণাঙ্গ Vercel প্রক্সি লিংক ব্যবহার করা হয়েছে
        fetch('https://adorable-mermaid-522003.vercel.app/api/proxy')
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n');
                let html = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let line = lines[i];
                        
                        // লোগো বের করা
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        let logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/60';
                        
                        // চ্যানেলের নাম বের করা
                        let nameParts = line.split(',');
                        let title = nameParts[nameParts.length - 1].trim();
                        
                        // স্ট্রিম লিংক বের করা
                        let streamUrl = lines[i + 1] ? lines[i + 1].trim() : '#';
                        
                        if (title && !title.startsWith('#')) {
                            html += `
                                <div class="channel-card">
                                    <img src="${logo}" alt="${title}" onerror="this.src='https://via.placeholder.com/60'">
                                    <h3>${title}</h3>
                                    <a href="${streamUrl}" target="_blank">Play Stream</a>
                                </div>
                            `;
                        }
                    }
                }
                document.getElementById('channels').innerHTML = html || '<p>কোনো চ্যানেল পাওয়া যায়নি।</p>';
            })
            .catch(error => {
                document.getElementById('channels').innerHTML = '<p>চ্যানেল লোড করতে সমস্যা হয়েছে।</p>';
            });
    </script>
</body>
</html>
