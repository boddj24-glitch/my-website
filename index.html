<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV - Live Streaming</title>
    <!-- Hls.js লাইব্রেরি যুক্ত করা হলো -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: #f39c12; margin: 0 0 10px; font-size: 24px; }
        
        /* Main Layout: Left Player, Right Sidebar */
        .main-container { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; flex-wrap: wrap; }
        
        .player-section { flex: 2; min-width: 300px; background: #181818; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .player-box { width: 100%; height: 450px; background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .player-box iframe, .player-box video { width: 100%; height: 100%; border: none; }
        
        .sidebar-section { flex: 1; min-width: 280px; background: #181818; padding: 15px; border-radius: 10px; border: 1px solid #333; max-height: 550px; overflow-y: auto; }
        .sidebar-section h3 { margin-top: 0; color: #f39c12; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* Channel List Styling */
        .channel-list { display: flex; flex-direction: column; gap: 10px; }
        .channel-item { display: flex; align-items: center; gap: 12px; background: #222; padding: 10px; border-radius: 6px; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .channel-item:hover { border-color: #f39c12; background: #2a2a2a; }
        .channel-item img { width: 45px; height: 45px; object-fit: contain; background: #111; border-radius: 50%; padding: 4px; }
        .channel-item span { font-size: 14px; font-weight: bold; color: #fff; word-break: break-word; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .player-box { height: 250px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHAWON TV</h1>
    </div>

    <div class="main-container">
        <!-- বামপাশের ভিডিও প্লেয়ার সেকশন -->
        <div class="player-section">
            <div class="player-box" id="player-container">
                <p style="color: #888;">দয়া করে ডানপাশ থেকে একটি চ্যানেল সিলেক্ট করুন</p>
            </div>
        </div>

        <!-- ডানপাশের চ্যানেল লিস্ট সাইডবার -->
        <div class="sidebar-section">
            <h3>লাইভ চ্যানেলসমূহ</h3>
            <div class="channel-list" id="channels">
                <p style="text-align: center; color: #888;">চ্যানেল লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script>
        // সরাসরি গিটহাবের র-লিংক থেকে M3U ডাটা ফেচ করা
        fetch('https://raw.githubusercontent.com/boddj24-glitch/my-website/refs/heads/main/smart%2020tv')
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n');
                let html = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF')) {
                        let line = lines[i];
                        
                        // লোগো বের করা
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        let logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/60';
                        
                        // চ্যানেলের নাম বের করা
                        let nameParts = line.split(',');
                        let title = nameParts[nameParts.length - 1].trim();
                        
                        // স্ট্রিম লিংক বের করা
                        let streamUrl = lines[i + 1] ? lines[i + 1].trim() : '#';
                        
                        if (title && !title.startsWith('#')) {
                            html += `
                                <div class="channel-data channel-item" data-url="${streamUrl}">
                                    <img src="${logo}" alt="${title}" onerror="this.src='https://via.placeholder.com/60'">
                                    <span>${title}</span>
                                </div>
                            `;
                        }
                    }
                }
                
                const channelContainer = document.getElementById('channels');
                channelContainer.innerHTML = html || '<p>কোনো চ্যানেল পাওয়া যায়নি।</p>';

                // চ্যানেল ক্লিক করলে প্লেয়ারে ভিডিও লোড হওয়ার ফাংশন
                document.querySelectorAll('.channel-data').forEach(item => {
                    item.addEventListener('click', function() {
                        let url = this.getAttribute('data-url');
                        let playerBox = document.getElementById('player-container');
                        
                        playerBox.innerHTML = `<video id="videoElement" controls autoplay style="width:100%; height:100%; background:#000;"></video>`;
                        
                        const video = document.getElementById('videoElement');

                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                video.play();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                            video.addEventListener('loadedmetadata', function() {
                                video.play();
                            });
                        }
                    });
                });
            })
            .catch(error => {
                document.getElementById('channels').innerHTML = '<p style="color:red; text-align:center;">চ্যানেল লোড করতে সমস্যা হয়েছে।</p>';
            });
    </script>
</body>
</html>
